# ═══════════════════════════════════════════════════════════════════════
# ModBus Slave —— 本仓库自带的 docker compose（与 modbus-master 仓库分开）
#
#   首次启动：
#     docker network create modbus-net 2>/dev/null || true
#     docker compose up -d --build
#   查看：  docker compose ps
#   日志：  docker compose logs -f
#   停止：  docker compose down
#
#   ⚠️ 两个仓库 = 两个**独立的 compose 项目**，靠一张**外部共享网络**互通。
#      网络名固定为 modbus-net，两侧都声明 external: true。含义是：
#        · 谁都不"拥有"这张网 ⇒ 任何一侧 down 都不会把它删掉；
#        · 代价是必须先手工建一次（就是上面那行；已存在时无副作用）。
#      ⇒ 所以**一定要先起从站、后起主站**：主站要能解析到 modbus-slave 这个名字。
#
#   ⚠️ 这里**没有 depends_on**。depends_on 只认同一个 compose 文件里的服务，
#      跨仓库引用会直接报错（实测：compose 校验阶段就失败）。启动顺序请自己保证。
#
#   演示流程见 modbus-master 仓库的 docker-compose.yml 顶部说明。
#   从裸机 supervisor 迁移过来的完整步骤见 DEPLOY.md §9.8。
# ═══════════════════════════════════════════════════════════════════════

name: modbus-slave

services:
  # 既提供管理界面，也监听 ModBus TCP 端口，对外当一个"真设备"
  modbus-slave:
    build:
      context: .
      # 想换 Node 版本：加 args: { NODE_VERSION: "22" }
    image: modbus-slave:local
    container_name: modbus-slave
    init: true                 # 让 PID 1 能正确转发信号、回收僵尸进程
    environment:
      # ⚠️ 这三个变量在 Dockerfile 里已设。这里再写一遍是**故意的**：
      #    compose 是"怎么跑"的最终事实来源，看这一个文件就够。
      COZE_PROJECT_ENV: PROD   # 不设 = dev 模式，不报错但极慢
      DEPLOY_RUN_PORT: "5001"
      HOSTNAME: 0.0.0.0        # 不覆盖会被 Docker 塞成容器 ID
    ports:
      - "5001:5001"            # 管理界面 + /ws/slave
      - "502:502"              # ModBus TCP 标准端口（界面里从站用默认 502 时走这条）
      - "1502:1502"            # 备用：界面里从站端口填 1502 时走这条
      #
      # ── 关于 502 特权端口 ──────────────────────────────────────────
      # 容器里**不存在**特权端口问题：容器内 net.ipv4.ip_unprivileged_port_start=0，
      # 且本镜像没写 USER 指令（以 root 跑）⇒ 容器内绑 502 不需要任何授权。
      # 宿主侧 502 由 dockerd / docker-proxy 绑定，它也是 root ⇒ 同样不需要
      # setcap / sysctl。所以 §3.3 那一整套在 docker 下**全都不需要**。
      #
      # ⚠️ 宿主 502 若已被别的程序占用，`up` 会报 bind: address already in use。
      #    排查：ss -lntp | grep 502
      #
      # ⚠️ 在界面上开的**每一个**从站端口，只要想从容器外访问，这里就得有一行。
      #    容器内绑任意端口都可以（含 502），但"对外可见"必须靠 ports 发布。
      #    端口多时用**区间写法**一次发一段（两侧必须**等长**）：
      # - "502-505:502-505"    # 一次发布 502 / 503 / 504 / 505
      # 只给容器之间互联用的端口不用写（容器网络内任意端口都通）。
    # 要用串口（RTU/ASCII）：把宿主串口设备映射进容器。**仅 Linux 宿主可行**；
    # Windows 的 Docker Desktop（WSL2）传不进 COM 口，串口请改走裸机部署。
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    networks:
      - modbus-net
    restart: unless-stopped
    stop_grace_period: 20s     # 从站可能挂着真实设备的连接，别被硬杀
    logging:
      driver: json-file
      options:
        max-size: "10m"        # 不设上限会一直涨，长期跑必炸磁盘
        max-file: "3"

networks:
  modbus-net:
    name: modbus-net
    external: true
